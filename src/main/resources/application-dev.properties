# Development Profile Configuration

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/routing_dev
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.cache.type=redis
spring.cache.redis.time-to-live=600000

# Security - JWT (Development keys - NEVER use in production)
jwt.secret=dev-secret-key-change-in-production-min-256-bits
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# External APIs
# Google Maps API
google.maps.api.key=${GOOGLE_MAPS_API_KEY:your-dev-api-key-here}
google.maps.api.url=https://maps.googleapis.com/maps/api

# Mapbox API (alternative)
mapbox.api.key=${MAPBOX_API_KEY:your-dev-api-key-here}
mapbox.api.url=https://api.mapbox.com

# CORS Configuration (permissive for development)
cors.allowed-origins=http://localhost:3000,http://localhost:19006
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Kafka (if used)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=routing-backend-dev
spring.kafka.consumer.auto-offset-reset=earliest

# Dev Tools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Debug
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
